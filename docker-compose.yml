version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-optimization-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ml-optimization
    volumes:
      - ./logs:/app/logs

volumes:
  logs:

networks:
  ml-optimization:
    driver: bridge

# Development override configuration
# Use: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
